services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cholavin
      POSTGRES_USER: cholavin
      POSTGRES_PASSWORD: cholavin
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cholavin"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
      # macOS bind mounts don't deliver inotify events reliably; poll so
      # uvicorn --reload actually reloads on edits.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      bash -c "alembic upgrade head &&
               python -m app.seed &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}

  worker:
    build: ./backend
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
    command: celery -A app.workers.celery_app.celery worker --beat --loglevel=info
    volumes: ["./backend:/app"]
    depends_on:
      backend: {condition: service_started}
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}

  frontend:
    build: ./frontend
    # No VITE_API_URL: the SPA uses a relative /api base, proxied to the backend
    # by Vite (see vite.config.ts) — so it works behind a single public URL.
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  mongodata:
